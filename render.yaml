# Render blueprint: Flask prediction API + the Vite dashboard.
#
#   1. Push this repo to GitHub
#   2. Render dashboard -> New -> Blueprint -> pick this repo
#   3. Fill in the env vars marked `sync: false` (they are secrets)
#
# The maternal anemia models are committed under backend/models/, so no
# training happens at deploy time. Retrain locally with
# `cd backend && python train_maternal_anemia.py` and commit the new .pkl files.
services:
  - type: web
    name: prakriva-api
    runtime: python
    rootDir: backend
    plan: starter          # free tier sleeps; xgboost + pandas need ~512MB RAM
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: CORS_ORIGINS
        value: https://prakriva-web.onrender.com   # replace with your dashboard's URL
      - key: OPENAI_API_KEY
        sync: false
      - key: FIREBASE_KEY_PATH
        sync: false        # e.g. a Render secret file at /etc/secrets/firebase_key.json

  - type: web
    name: prakriva-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://prakriva-api.onrender.com   # replace with your API's URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
